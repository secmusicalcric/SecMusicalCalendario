name: Enviar Notificações de Ensaios

on:
  schedule:
    # Horários em UTC correspondentes a 08:00, 12:00 e 17:00 no horário de Brasília (UTC-3)
    - cron: '0 11,15,20 * * *'
  workflow_dispatch:

jobs:
  send-push:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Instalar dependências do script de Push
        run: npm --prefix scripts/push install --omit=dev

      - name: Verificar eventos (Hoje/Amanhã) e enviar notificações
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: node scripts/push/send-push.mjs
